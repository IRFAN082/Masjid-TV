plugins {
    id 'com.android.application'
}

android {
    namespace 'my.masjid.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'my.masjid.tv'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded, never published: debug key so updates install over each other.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
